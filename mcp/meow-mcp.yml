server:
  name: meow
  transport: http
  surfaces:
  - name: oauth
    url: https://mcp.meow.com
    auth: oauth2.1-pkce
    best_for: Interactive assistants (Claude.ai, Claude Code, ChatGPT, Cursor, VS Code, Goose)
    access: All entities the login can reach
  - name: cli
    url: https://mcp.meow.com/cli
    auth: api-key-bearer
    best_for: Coding agents, automation, and agent-led signup
    access: The single entity the API key is scoped to
install:
  claude_code: claude mcp add --transport http meow https://mcp.meow.com
scopes:
- meow.read
- meow.transfers
- meow.cards
- meow.billing
safety:
  human_in_the_loop: >-
    Transfer tools never move money; each creates a draft in a pending-approval
    state that a human must approve on the Meow dashboard.
  annotations: Tools carry readOnlyHint / destructiveHint for client confirmation prompts.
  enforcement: Per-call checks of token authenticity, role on the target entity, granted scope, entity status, session revocation, and MFA.
