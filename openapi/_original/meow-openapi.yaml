    EntityOnboardingStatusResponse:
      properties:
        entity_id:
          type: string
          format: uuid
          title: Entity Id
          description: Public ID of the onboarded business entity, stable across the
            onboarding lifecycle and matching the `entity_id` used in the Customer
            API, MCP, and webhook payloads.
        status:
          $ref: '#/components/schemas/OnboardingApplicationStatus'
          description: Current onboarding status.
        business_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Name
          description: Legal business name.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: ISO 8601 timestamp of when the entity was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: ISO 8601 timestamp of when onboarding was last updated.
        documents:
          items:
            $ref: '#/components/schemas/OnboardingDocumentStatus'
          type: array
          title: Documents
          description: Documents uploaded during onboarding.
        kyc_status:
          $ref: '#/components/schemas/OnboardingKycStatus'
          description: 'Identity verification status of the primary representative.
            After you submit KYC data or they complete verification, this moves to
            `pending` and resolves on its own; poll it to track progress. `action_required`
            means their verification needs another step from them (for example, a
            document): create a link with `POST /entities/{entity_id}/representatives/{representative_id}/verification-link`
            and share it so they can finish. See `representatives` for every representative''s
            status.'
        onboarding_type:
          $ref: '#/components/schemas/PublicOnboardingType'
          description: How this entity was onboarded (e.g. `api`, `smb`, `partner`).
        next_step:
          $ref: '#/components/schemas/OnboardingNextStep'
          description: 'What you must do next: the current onboarding step, the items
            still missing for it, and whether the application is ready to be submitted
            for review.'
        representatives:
          items:
            $ref: '#/components/schemas/OnboardingRepresentativeKyc'
          type: array
          title: Representatives
          description: Every representative on the application with their identity
            verification (KYC) status. The top-level `kyc_status` reflects the primary
            representative; the application can only be approved once every representative
            is approved.
        consent_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Url
          description: Link where the primary representative reviews and accepts the
            required agreements and disclosures in their browser. Populated once the
            application has been submitted; share it with the primary representative.
            The link needs no login and anyone holding it can accept on the business's
            behalf, so treat it as a secret.
      type: object
      required:
      - entity_id
      - status
      - business_name
      - created_at
      - updated_at
      - documents
      - kyc_status
      - onboarding_type
      - next_step
      - representatives
      - consent_url
      title: EntityOnboardingStatusResponse
    EntityOnboardingSummary:
      properties:
        entity_id:
          type: string
          format: uuid
          title: Entity Id
          description: Public ID of the onboarded business entity, stable across the
            onboarding lifecycle and matching the `entity_id` used in the Customer
            API, MCP, and webhook payloads.
        status:
          $ref: '#/components/schemas/OnboardingApplicationStatus'
          description: Current onboarding status.
        business_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Name
          description: Legal business name.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: ISO 8601 timestamp of when the entity was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: ISO 8601 timestamp of when onboarding was last updated.
        onboarding_type:
          $ref: '#/components/schemas/PublicOnboardingType'
          description: How this entity was onboarded (e.g. `api`, `smb`, `partner`).
      type: object
      required:
      - entity_id
      - status
      - business_name
      - created_at
      - updated_at
      - onboarding_type
      title: EntityOnboardingSummary
    EntityRepresentativeKycResponse:
      properties:
        representative_id:
          type: string
          format: uuid
          title: Representative Id
          description: ID of the representative whose KYC was submitted.
        kyc_status:
          $ref: '#/components/schemas/OnboardingKycStatus'
          description: This representative's identity verification status right after
            submission. It completes asynchronously; track this representative's status
            in the `representatives` array on `GET /entities/{entity_id}` or via the
            `identity_verification.*` webhooks. The entity's top-level `kyc_status`
            reflects only the primary representative, and `next_step` advances once
            every representative has started verification (not once they pass) — so
            neither confirms this representative's outcome.
      type: object
      required:
      - representative_id
      - kyc_status
      title: EntityRepresentativeKycResponse
    EntityRepresentativeListResponse:
      properties:
