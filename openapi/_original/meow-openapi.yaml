    PartnerKycSubmissionRequest:
      properties:
        first_name:
          type: string
          minLength: 1
          title: First Name
          description: Legal first name.
          examples:
          - Felix
        last_name:
          type: string
          minLength: 1
          title: Last Name
          description: Legal last name.
          examples:
          - Whiskers
        date_of_birth:
          $ref: '#/components/schemas/DateString'
          description: Date of birth (`YYYY-MM-DD`).
        id_number:
          type: string
          format: password
          title: Id Number
          description: Government ID number matching `id_type`. For `us_ssn` use nine
            digits, with or without dashes (123-45-6789 or 123456789); for `us_ssn_last_4`
            use the last four digits; for non-US ID types provide the number as issued.
            Formatting characters are stripped before verification.
          writeOnly: true
          examples:
          - 123-45-6789
        id_type:
          $ref: '#/components/schemas/ExtPlaidIDNumberType'
          description: Type of government ID. Defaults to `us_ssn`; non-US representatives
            pass their country-specific type (e.g. `sg_nric`, `au_passport`, `ca_sin`).
          default: us_ssn
        address:
          $ref: '#/components/schemas/OnboardingAddress'
          description: Residential address.
        phone_number:
          anyOf:
          - type: string
            pattern: ^\+[1-9]\d{1,14}$
          - type: 'null'
          title: Phone Number
          description: Phone number in E.164 format (e.g. +14155550123).
          examples:
          - '+14155550123'
        ip:
          type: string
          format: ipvanyaddress
          title: Ip
          description: IPv4 or IPv6 address of the end user submitting this verification.
            Forwarded to the identity-verification provider as a fraud signal.
          examples:
          - 203.0.113.42
        user_email:
          type: string
          format: email
          title: User Email
          description: Email address of the applicant this KYC data belongs to. Must
            match the `user_email` the application was created with.
      type: object
      required:
      - first_name
      - last_name
      - date_of_birth
      - id_number
      - address
      - ip
      - user_email
      title: PartnerKycSubmissionRequest
    PartnerKycSubmissionResponse:
      properties:
        application_id:
          type: string
          format: uuid
          title: Application Id
          description: Unique application identifier.
        user_email:
          type: string
          title: User Email
          description: Email address of the verified applicant.
        kyc_status:
          $ref: '#/components/schemas/OnboardingKycStatus'
          description: 'Identity verification status after this submission. Verification
            usually completes asynchronously; poll the application status endpoint
            for the final result. This polled status has no `action_required` value:
            attempts the `identity_verification.*` webhook stream reports as `identity_verification.action_required`
            appear here as `pending` until a new attempt resolves.'
      type: object
      required:
      - application_id
      - user_email
      - kyc_status
      title: PartnerKycSubmissionResponse
