components:
  schemas:
    AcceptedPaymentMethods:
      type: string
      enum:
      - cash
      - check
      - credit_card
      - electronic_transfer
      title: AcceptedPaymentMethods
    AccessibleEntity:
      properties:
        entity_id:
          type: string
          title: Entity Id
          description: The entity's public identifier.
        entity_name:
          type: string
          title: Entity Name
          description: The entity's name.
        access_type:
          $ref: '#/components/schemas/AccessibleEntityAccessType'
          description: How your API key gains access to the entity.
        role:
          anyOf:
          - $ref: '#/components/schemas/UserRoleEnum'
          - type: 'null'
          description: Your role and permissions for this entity, when applicable
            (global API keys only).
      type: object
      required:
      - entity_id
      - entity_name
      - access_type
      title: AccessibleEntity
      description: An entity your API key can access.
    AccessibleEntityAccessType:
      type: string
      enum:
      - global_api_key
      - entity_api_key
      title: AccessibleEntityAccessType
    AccountCategory:
      type: string
      enum:
      - DEPOSIT_ACCOUNT
      - DIGITAL_WALLET
      - INVESTMENT_ACCOUNT
      title: AccountCategory
    AccountDescriptor:
      properties:
        accountId:
          $ref: '#/components/schemas/Identifier'
          description: Unique identifier for this account.
        accountType:
          $ref: '#/components/schemas/AccountType'
          description: The type of account.
        accountNumberDisplay:
          anyOf:
          - type: string
          - type: 'null'
          title: Accountnumberdisplay
          description: Last 4 digits of the account number.
          examples:
          - 4321
        productName:
          type: string
          title: Productname
          description: Product name (e.g., Business Checking, Treasury).
        nickname:
          anyOf:
          - type: string
          - type: 'null'
          title: Nickname
          description: Custom display name for the account.
        status:
          $ref: '#/components/schemas/AccountStatus'
          description: Current account status.
        currency:
          $ref: '#/components/schemas/Currency'
          description: Currency of the account.
      type: object
      required:
      - accountId
      - accountType
      - productName
      - status
      - currency
      title: AccountDescriptor
    AccountPaymentNetwork:
      properties:
        bankId:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankid
          description: The bank identifier used by this payment network, such as the
            routing number for ACH and wire.
        identifier:
          anyOf:
          - type: string
          - type: 'null'
          title: Identifier
          description: The number used to identify the account within the payment
            network.
        type:
          $ref: '#/components/schemas/PaymentNetworkType'
          description: The type of payment network.
        transferIn:
          type: boolean
          title: Transferin
          description: Whether the account can currently receive transfers (be credited)
            through this payment network.
        transferOut:
          type: boolean
          title: Transferout
          description: Whether the account can currently send transfers (be debited)
            through this payment network.
        network:
          anyOf:
          - $ref: '#/components/schemas/BlockchainNetwork'
          - type: 'null'
          description: The blockchain network for crypto payment networks.
        bankName:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankname
          description: Name of the bank for wire/ACH deposits.
        bankAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Bankaddress
          description: Address of the bank for wire/ACH deposits.
        beneficiaryName:
          anyOf:
          - type: string
          - type: 'null'
          title: Beneficiaryname
          description: Name of the beneficiary for wire/ACH deposits.
        beneficiaryAddress:
          anyOf:
          - type: string
          - type: 'null'
          title: Beneficiaryaddress
          description: Address of the beneficiary for wire/ACH deposits.
        accountType:
          anyOf:
          - $ref: '#/components/schemas/AccountType'
          - type: 'null'
          description: The type of account (e.g. CHECKING, SAVINGS).
        swiftCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Swiftcode
          description: SWIFT/BIC code of the beneficiary bank for international wires.
        intermediaryBank:
          anyOf:
          - $ref: '#/components/schemas/IntermediaryBankSWIFT'
          - type: 'null'
          description: Intermediary bank details for international wire transfers.
        fiToFiReference:
          anyOf:
          - type: string
          - type: 'null'
          title: Fitofireference
          description: FI-to-FI reference for international wire transfers.
      type: object
      required:
      - type
      - transferIn
      - transferOut
      title: AccountPaymentNetwork
    AccountPaymentNetworkList:
      properties:
        page:
          anyOf:
          - $ref: '#/components/schemas/PageMetadata'
          - type: 'null'
          description: Metadata for pagination.
        paymentNetworks:
          items:
            $ref: '#/components/schemas/AccountPaymentNetwork'
          type: array
          minItems: 0
          title: Paymentnetworks
          description: Array of payment networks, or an empty array if none are available.
            Not all accounts support every network; for example, a prepaid debit card
            account does not support ACH.
          examples:
          - - bankId: 010088889
              identifier: '1111222233335820'
              transferIn: true
              transferOut: true
              type: US_ACH
          - - bankId: 010088889
              identifier: '1111222233335820'
              transferIn: true
              transferOut: true
              type: US_ACH
            - identifier: '0x1234567890abcdef1234567890abcdef12345678'
              network: ETHEREUM
              transferIn: true
              transferOut: true
              type: USDC
          - - identifier: 8xDc123456789abcdef123456789abcdef123456789abcdef
              network: SOLANA
              transferIn: true
              transferOut: true
              type: USDC
      type: object
      required:
      - paymentNetworks
      title: AccountPaymentNetworkList
