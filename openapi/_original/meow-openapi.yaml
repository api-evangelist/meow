  /simulations/entities/{entity_id}/application_approval:
    post:
      tags:
      - Simulations
      summary: Simulate Application Approval
      description: '> ⚠️ **Sandbox & development only.** Simulation endpoints are
        not available in production and return `404 Not Found` there.


        Approves a submitted onboarding application in the sandbox as if the compliance
        review had passed, and kicks off checking-account onboarding for the selected
        product. Every representative must have passed identity verification (`kyc_status`
        is `approved`) first: like real review, the simulation will not approve an
        application whose beneficial owner failed KYC, and returns `400` until they
        pass. Requires a global API key with the `simulations:write` scope whose user
        administers the entity; the application must already be submitted. The application
        status moves to `submitted` immediately and to `approved` once the checking
        account activates — poll `GET /entities/{entity_id}` or subscribe to `application.*`
        webhooks to observe the transition. Safe to call repeatedly: if account opening
        stalls in the sandbox, calling this again completes it.'
      operationId: simulate_application_approval_simulations_entities__entity_id__application_approval_post
      parameters:
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
          title: Entity Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/SimulateApplicationApprovalRequest'
              - type: 'null'
              title: Request
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EntityOnboardingStatusResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
