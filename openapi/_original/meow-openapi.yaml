            KYC or mint a verification link.
        email:
          type: string
          title: Email
          description: Representative's email address.
        title_id:
          $ref: '#/components/schemas/RepresentativeTitle'
          description: The representative's job title.
        is_beneficial_owner:
          type: boolean
