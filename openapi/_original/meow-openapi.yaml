          items:
            $ref: '#/components/schemas/OnboardingRepresentativeKyc'
          type: array
          title: Representatives
          description: Every representative on the entity's application with their
            identity verification (KYC) status, primary representative first. Deleted
            representatives are omitted.
      type: object
      required:
      - representatives
      title: EntityRepresentativeListResponse
    EntityRepresentativeResponse:
      properties:
