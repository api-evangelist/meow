    Holding:
      properties:
        securityId:
          anyOf:
          - type: string
          - type: 'null'
          title: Securityid
          description: Security identifier used to look up the closing price. Required
            together with `securityIdType` unless you provide `symbol`.
        securityIdType:
          anyOf:
          - $ref: '#/components/schemas/SecurityIdType'
          - type: 'null'
          description: Type of security identifier provided (e.g., CUSIP, ISIN).
        holdingName:
          anyOf:
          - type: string
          - type: 'null'
          title: Holdingname
          description: Holding name or security name.
        holdingType:
          anyOf:
          - $ref: '#/components/schemas/HoldingType-Output'
          - type: 'null'
          description: The high-level type of the holding (e.g., STOCK, BOND).
        holdingSubType:
          anyOf:
          - $ref: '#/components/schemas/HoldingSubType'
          - type: 'null'
          description: The more granular subtype of the holding (e.g., CASH, MONEYMARKET).
        symbol:
          anyOf:
          - type: string
          - type: 'null'
          title: Symbol
          description: Ticker or market symbol. Required unless both `securityId`
            and `securityIdType` are provided.
        purchasedPrice:
          anyOf:
          - type: number
          - type: 'null'
          title: Purchasedprice
          description: Price of holding at the time of purchase. Used to determine
            the approximate cost basis using the purchase price and the number of
            units.
        currentUnitPrice:
          anyOf:
          - type: number
          - type: 'null'
          title: Currentunitprice
          description: Current unit price. Used as the institution price and fallback
            for the close price if a security ID is not provided.
        currentUnitPriceDate:
          anyOf:
          - $ref: '#/components/schemas/DateString'
          - type: 'null'
          description: Current unit price as-of date. ISO 8601 full-date in format
            `YYYY-MM-DD`, per [RFC 3339](https://datatracker.ietf.org/doc/html/rfc3339.html#section-5.6).
        units:
          anyOf:
          - type: number
          - type: 'null'
          title: Units
          description: 'Quantity for security-based holdings: shares for stocks and
            mutual funds, face value for bonds, contracts for options. Required when
            the holding involves a security.'
        marketValue:
          type: number
          title: Marketvalue
          description: Market value at the time the data was retrieved.
        faceValue:
          anyOf:
          - type: number
          - type: 'null'
          title: Facevalue
          description: Required for bonds. Face value at the time the data was retrieved.
            If not present, assume the holding isn't a bond and fall back to `marketValue`.
        cashAccount:
          type: boolean
          title: Cashaccount
          description: If true, indicates that this holding is used to maintain proceeds
            from sales, dividends, and other cash postings to the investment account.
            Used in determining if the security is a cash equivalent.
          default: false
        currency:
          anyOf:
          - $ref: '#/components/schemas/Currency'
          - type: 'null'
          description: Currency of the holding, if different from the account's currency.
      type: object
      required:
      - marketValue
      title: Holding
      description: A holding in an investment account.
    HoldingEntityType:
      type: string
      enum:
      - businesses
      - individuals
      - investors
      title: HoldingEntityType
    HoldingSubType:
      type: string
      enum:
      - CASH
      - MONEYMARKET
      title: HoldingSubType
      description: The subtype of an investment holding. Set `holdingSubType` to `CASH`
        or `MONEYMARKET` to indicate cash-type holdings.
    HoldingType-Input:
      type: string
      enum:
      - investor
      - real_estate
      title: HoldingType
    HoldingType-Output:
      type: string
      enum:
      - ANNUITY
      - BOND
      - CD
      - MUTUALFUND
      - OPTION
      - OTHER
      - STOCK
      title: HoldingType
      description: 'Types of financial holdings or investments.


        ANNUITY - A contract sold by financial institutions that provides fixed payments
        to the holder at specified intervals

        BOND - A debt security where an investor loans money to an entity for a defined
        period at a fixed interest rate

        CD - Certificate of Deposit, a time deposit with a bank with fixed term and
        interest rate

        MUTUALFUND - An investment vehicle made up of a pool of funds collected from
        many investors

        OPTION - A contract giving the buyer the right to buy or sell an underlying
        asset at a specific price

        OTHER - Any holding type not covered by the other categories

        STOCK - Shares or equity in a corporation'
