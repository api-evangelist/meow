    EntityCreateRepresentativeRequest:
      properties:
        is_beneficial_owner:
          type: boolean
          title: Is Beneficial Owner
          description: Whether this person owns 25% or more of the business.
          default: false
        percent_ownership:
          anyOf:
          - type: number
            maximum: 100.0
            minimum: 25.0
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,2}0*$
          - type: 'null'
          title: Percent Ownership
          description: Ownership percentage; required when `is_beneficial_owner` is
            true.
          examples:
          - '50'
        email:
          type: string
          format: email
          title: Email
          description: Email address of the representative.
          examples:
          - felix@catnipcoffee.com
        first_name:
          anyOf:
          - type: string
          - type: 'null'
          title: First Name
          description: Legal first name.
          examples:
          - Felix
        last_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Name
          description: Legal last name.
          examples:
          - Whiskers
        title_id:
          $ref: '#/components/schemas/RepresentativeTitle'
          description: The representative's job title.
        is_primary:
          type: boolean
          title: Is Primary
          description: Whether this representative is the primary representative (signer)
            for the application. Setting this demotes any existing primary; exactly
            one primary is required before the application can be submitted.
          default: false
      type: object
      required:
      - email
      - title_id
      title: EntityCreateRepresentativeRequest
    EntityDocumentConfirmRequest:
      properties:
        object_key:
          type: string
          title: Object Key
          description: Object key returned from the upload-url endpoint.
        proof_type:
          $ref: '#/components/schemas/PublicKybProofType'
          description: Type of KYB document being confirmed. Use the same `proof_type` you passed when
            requesting the upload URL.
        representative_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Representative Id
          description: The representative this document belongs to; must match the
            value passed when the upload URL was generated. Omit for business-level
            documents.
      type: object
      required:
      - object_key
      - proof_type
      title: EntityDocumentConfirmRequest
    EntityDocumentUploadRequest:
      properties:
        proof_type:
          $ref: '#/components/schemas/PublicKybProofType'
          description: Type of KYB document being uploaded. Common values are `incorporation` (certificate of
            incorporation or formation document), `address` (proof of business address), and
            `bank_statement`. Non-US businesses also upload `shareholder_registry` (your shareholder
            registry, also called the register of members) and `officer_registry` (your register of
            directors and officers). The onboarding status response lists exactly what an entity
            owes in `next_step.required_proof_types`.
        file_name:
          type: string
          title: File Name
          description: Original file name including extension.
        content_type:
          type: string
          title: Content Type
          description: MIME type of the file (e.g. `application/pdf`, `image/png`).
          default: application/pdf
        representative_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Representative Id
          description: Attach this document to a representative (e.g. their ID or
            proof of address). Pass the `representative_id` returned when the representative
            was added or listed; omit for business-level documents. Pass the same
            value again when confirming the upload — the confirm call is what records
            the link.
      type: object
      required:
      - proof_type
      - file_name
      title: EntityDocumentUploadRequest
    EntityDueDiligenceForm:
      properties:
        form_type:
          $ref: '#/components/schemas/DueDiligenceFormType'
          description: The required due diligence form.
        complete:
          type: boolean
          title: Complete
          description: Whether this form has been submitted for the entity.
        requires_webapp:
          type: boolean
          title: Requires Webapp
          description: Whether this form must be completed in the web app. Forms that
            collect document uploads cannot be submitted through the API; the others
            can be fetched and submitted via the due-diligence endpoints.
      type: object
      required:
      - form_type
