    CreateAccountRequest:
      properties:
        product:
          $ref: '#/components/schemas/OpenableBankProduct'
          description: The product to open the new account under. You must already
            have an open account of this product. The account may open immediately
            (status `created`, with `account_id`) or in the background (status `processing`);
            when `processing`, poll `GET /accounts` until the account appears.
          examples:
          - grasshopper
      type: object
      required:
      - product
      title: CreateAccountRequest
    CreateAccountResponse:
      properties:
        status:
          $ref: '#/components/schemas/CreateAccountStatus'
          description: '`created` when the new account is ready immediately and its
            `account_id` is returned. `processing` when the account is still being
            opened; poll `GET /accounts` until it appears.'
          examples:
          - created
        account_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Account Id
          description: The new `account_id`, returned only when status is `created`.
            Null when status is `processing`; fetch it from `GET /accounts` once the
            account appears.
          examples:
          - cash_account_3f9c1b2e-7a4d-4e88-9c21-0b6f5d8e1a2c
      type: object
      required:
      - status
      title: CreateAccountResponse
    CreateAccountStatus:
      type: string
      enum:
      - processing
      - created
      title: CreateAccountStatus
      x-enum-varnames:
      - processing
      - created
