        object_key:
          type: string
          title: Object Key
          description: Object key, required when confirming the upload.
        max_bytes:
          type: integer
          title: Max Bytes
          description: Maximum allowed file size in bytes.
        expires_in_seconds:
          type: integer
          title: Expires In Seconds
          description: Number of seconds until the upload URL expires.
      type: object
      required:
