        percent_ownership:
          anyOf:
          - type: string
            pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          - type: 'null'
          title: Percent Ownership
          description: Ownership percentage, if any.
        is_primary:
          type: boolean
          title: Is Primary
          description: Whether they are the primary representative (signer).
      type: object
      required:
      - representative_id
      - email
      - title_id
      - is_beneficial_owner
      - percent_ownership
      - is_primary
