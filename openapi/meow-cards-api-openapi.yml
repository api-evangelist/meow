      - virtual
    ExtAwxCardTransactionStatus:
      type: string
      enum:
      - APPROVED
      - PENDING
      - FAILED
      - CLEARED
      - REVERSED
      - EXPIRED
      title: ExtAwxCardTransactionStatus
      x-enum-varnames:
      - APPROVED
      - PENDING
      - FAILED
      - CLEARED
      - REVERSED
      - EXPIRED
    CardMetadata:
      properties:
        card_id:
          type: string
          format: uuid
          title: Card Id
          description: Identifier for the issued card.
        task_description:
          type: string
          title: Task Description
          description: What you are purchasing.
      type: object
      required:
      - card_id
      - task_description
      title: CardMetadata
    CardDetailsResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
          description: Unique card identifier.
        billing_address:
          $ref: '#/components/schemas/JAddress'
          description: Card billing address.
        delivery_address:
          anyOf:
          - type: string
          - type: 'null'
          title: Delivery Address
          description: Masked delivery address for the physical card.
        debit_account:
          $ref: '#/components/schemas/CardDebitAccount'
          description: Linked banking account.
        tracking_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Tracking Url
          description: Shipping tracking URL for the physical card.
      type: object
      required:
      - id
      - billing_address
      - debit_account
      title: CardDetailsResponse
    TransactionEarnedCashback:
      properties:
        dollars:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d*$
          title: Dollars
        percentage:
          type: string
          pattern: ^(?!^[-+.]*$)[+-]?0*\d*\.?\d{0,4}0*$
          title: Percentage
          description: Percentage represented as 4 digit decimal. 0.0001 = 0.01%. Max is 0.05 = 5%
      type: object
      required:
      - dollars
      - percentage
      title: TransactionEarnedCashback
    UpdateCardRequest:
      properties:
        status:
          anyOf:
          - $ref: '#/components/schemas/CardStatusUpdate'
          - type: 'null'
          description: Set to `inactive` to freeze the card or `active` to unfreeze it.
        nickname:
          anyOf:
          - type: string
