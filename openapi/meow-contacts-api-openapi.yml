      - usdt
      - dai
      - pyusd
      - cash
      - usdg
      - usdv
      - eurc
      - usd
    CustomerApiPaymentMethodType:
      type: string
      enum:
      - ach
      - wire
      - check
      - international
      - crypto
      - static_memo
      title: CustomerApiPaymentMethodType
      x-enum-varnames:
      - ach
      - wire
      - check
      - international
      - crypto
      - static_memo
