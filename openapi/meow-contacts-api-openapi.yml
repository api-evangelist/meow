      properties:
        ach:
          anyOf:
          - $ref: '#/components/schemas/MeowApiAchSubobject'
          - type: 'null'
        wire:
          anyOf:
          - $ref: '#/components/schemas/MeowApiWireSubobject'
          - type: 'null'
        check:
          anyOf:
          - $ref: '#/components/schemas/MeowApiCheckSubobject'
          - type: 'null'
        tch:
