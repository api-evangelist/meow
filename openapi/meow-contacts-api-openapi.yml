        country:
          $ref: '#/components/schemas/CountryCodeAlpha2'
        postal_code:
          anyOf:
          - type: string
            maxLength: 20
            minLength: 1
          - type: 'null'
          title: Postal Code
      type: object
      required:
      - street_line_1
      - city
      - country
      title: MeowAddressRequest
    MeowApiCrNowSubobject:
      properties:
        account_number:
          type: string
          maxLength: 18
          minLength: 1
          title: Account Number
        account_type:
          $ref: '#/components/schemas/TreasuryPrimeAccountType'
        routing_number:
          type: string
          maxLength: 9
          minLength: 9
          title: Routing Number
        address_on_account:
          anyOf:
          - $ref: '#/components/schemas/MeowApiAddress'
