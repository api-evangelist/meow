          - type: boolean
          - type: integer
          - type: number
          - items:
              type: string
            type: array
          - type: 'null'
          title: Default Value
        choices:
          anyOf:
          - items:
              $ref: '#/components/schemas/DDChoice'
            type: array
          - type: 'null'
          title: Choices
        visible_when:
          anyOf:
          - $ref: '#/components/schemas/DDCondition'
          - $ref: '#/components/schemas/DDCompoundCondition'
          - type: 'null'
          title: Visible When
        required_when:
          anyOf:
          - $ref: '#/components/schemas/DDCondition'
          - $ref: '#/components/schemas/DDCompoundCondition'
          - type: 'null'
          title: Required When
        validation:
          anyOf:
          - $ref: '#/components/schemas/DDValidation'
          - type: 'null'
        multiple:
