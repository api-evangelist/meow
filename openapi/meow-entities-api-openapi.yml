          description: 'This representative''s identity verification status, kept consistent with the `identity_verification.*` webhook events. `action_required` means their verification needs another step from them (for example, a document or selfie): create a link with `POST /entities/{entity_id}/representatives/{representative_id}/verification-link` and share it so they can finish.'
      type: object
      required:
      - representative_id
      - first_name
      - last_name
      - email
      - is_primary
      - is_beneficial_owner
      - percent_ownership
      - kyc_status
      title: OnboardingRepresentativeKyc
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    Timestamp:
      type: string
      format: date-time
      title: Timestamp
      description: ISO 8601 date-time in the format `YYYY-MM-DDThh:mm:ss.nnn[Z|[+|-]hh:mm]` (per [IETF RFC 3339](https://xml2rfc.tools.ietf.org/public/rfc/html/rfc3339.html#anchor14)).
    HoldingEntityType:
      type: string
      enum:
      - businesses
      - individuals
      - investors
      title: HoldingEntityType
    OnboardingNextStep:
      properties:
        step:
          $ref: '#/components/schemas/OnboardingStep'
          description: The onboarding step the application is currently on.
        phase:
          $ref: '#/components/schemas/OnboardingPhase'
          description: Coarse onboarding phase (collecting info, ready to submit, or submitted).
        missing:
          items:
            type: string
          type: array
          title: Missing
          description: Items you still need to provide to advance past the current step. Empty once the step is satisfied.
        required_proof_types:
          items:
            $ref: '#/components/schemas/PublicKybProofType'
          type: array
          title: Required Proof Types
          description: KYB documents you still owe, as `proof_type` values to pass to the document upload endpoint. For a non-US business this usually includes `incorporation`, `shareholder_registry` (your shareholder registry or register of members), and `officer_registry` (your register of directors). Empty once every required document is on file.
        can_submit:
          type: boolean
          title: Can Submit
          description: Whether all requirements are met and the application is ready to be submitted for review.
      type: object
      required:
      - step
      - phase
      - missing
      - can_submit
      title: OnboardingNextStep
    InvestmentsDueDiligence:
      properties:
        overview:
          type: string
          title: Overview
        international_investments:
          type: boolean
          title: International Investments
        countries_invested:
          anyOf:
