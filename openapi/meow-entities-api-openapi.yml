        works_with_investors:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Works With Investors
        investors:
          anyOf:
          - $ref: '#/components/schemas/InvestorsDueDiligence'
          - type: 'null'
      type: object
      required:
      - overview
      - international_investments
      - registered_sec
      - current_portfolio_value
      title: InvestmentsDueDiligence
    InvestorsDueDiligence:
