          examples:
          - 12-3456789
        business_website:
          anyOf:
          - type: string
            maxLength: 400
            minLength: 0
          - type: 'null'
          title: Business Website
          description: Public website of the business.
          examples:
          - https://catnipcoffee.com
        business_description:
          anyOf:
          - type: string
            maxLength: 400
            minLength: 0
          - type: 'null'
          title: Business Description
          description: Short description of what the business does.
          examples:
          - Specialty coffee roaster and cafe
        industry:
          anyOf:
          - $ref: '#/components/schemas/Industry'
          - type: 'null'
          description: The industry the business operates in.
        account_purpose:
          anyOf:
          - $ref: '#/components/schemas/AccountPurpose'
          - type: 'null'
          description: Why the business needs the account.
        account_purpose_description:
          anyOf:
          - type: string
            maxLength: 400
            minLength: 0
          - type: 'null'
          title: Account Purpose Description
          description: Free-text detail for the account purpose, when relevant.
        provides_blockchain_or_digital_currency_services:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Provides Blockchain Or Digital Currency Services
          description: Whether the business provides blockchain or digital currency services.
        transacts_in_digital_currency:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Transacts In Digital Currency
          description: Whether the business transacts in digital currency.
        develops_governs_supports_blockchain_protocol:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Develops Governs Supports Blockchain Protocol
          description: Whether the business develops, governs, or supports a blockchain protocol.
        business_name:
          anyOf:
          - type: string
            maxLength: 400
            minLength: 1
          - type: 'null'
          title: Business Name
          description: Legal business name.
          examples:
          - Catnip Coffee Co
        business_date_of_incorporation:
          anyOf:
          - $ref: '#/components/schemas/DateString'
          - type: 'null'
          description: Date the business was incorporated.
        incorporation_state:
          anyOf:
          - $ref: '#/components/schemas/StateCode'
          - type: 'null'
          description: US state of incorporation. Required for businesses incorporated in the US; omit for businesses incorporated elsewhere.
          examples:
          - DE
        legal_structure:
          anyOf:
          - $ref: '#/components/schemas/LegalStructure'
          - type: 'null'
          description: Legal structure of the business (e.g. `llc`, `corp`). Businesses incorporated outside the US use `foreign_entity`.
        business_address:
          anyOf:
          - $ref: '#/components/schemas/OnboardingAddress'
          - type: 'null'
          description: Registered legal business address. Must be in a country where Meow supports business onboarding; unsupported countries are rejected with the full supported list.
        physical_address:
          anyOf:
          - $ref: '#/components/schemas/OnboardingAddress'
          - type: 'null'
          description: Primary operating address, sent together with `business_address`. Provide it only when it differs from the legal address; omitting it keeps a physical address already on file, or uses the legal address when none is set yet.
        reference_id:
          anyOf:
          - type: string
            maxLength: 255
            minLength: 1
          - type: 'null'
          title: Reference Id
          description: 'Your own identifier for this entity. Pass the same value to retry safely: a create reusing a `reference_id` you already used returns the original entity instead of creating a duplicate.'
          examples:
          - order-2026-04-001
      type: object
      title: CreateBusinessEntityRequest
    EntityOnboardingStatusResponse:
      properties:
        entity_id:
          type: string
          format: uuid
          title: Entity Id
          description: Public ID of the onboarded business entity, stable across the onboarding lifecycle and matching the `entity_id` used in the Customer API, MCP, and webhook payloads.
        status:
          $ref: '#/components/schemas/OnboardingApplicationStatus'
          description: Current onboarding status.
        business_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Business Name
          description: Legal business name.
        created_at:
          $ref: '#/components/schemas/Timestamp'
          description: ISO 8601 timestamp of when the entity was created.
        updated_at:
          $ref: '#/components/schemas/Timestamp'
          description: ISO 8601 timestamp of when onboarding was last updated.
        documents:
          items:
            $ref: '#/components/schemas/OnboardingDocumentStatus'
          type: array
          title: Documents
          description: Documents uploaded during onboarding.
        kyc_status:
          $ref: '#/components/schemas/OnboardingKycStatus'
          description: 'Identity verification status of the primary representative. After you submit KYC data or they complete verification, this moves to `pending` and resolves on its own; poll it to track progress. `action_required` means their verification needs another step from them (for example, a document): create a link with `POST /entities/{entity_id}/representatives/{representative_id}/verification-link` and share it so they can finish. See `representatives` for every representative''s status.'
        onboarding_type:
          $ref: '#/components/schemas/PublicOnboardingType'
          description: How this entity was onboarded (e.g. `api`, `smb`, `partner`).
        next_step:
          $ref: '#/components/schemas/OnboardingNextStep'
          description: 'What you must do next: the current onboarding step, the items still missing for it, and whether the application is ready to be submitted for review.'
        representatives:
          items:
            $ref: '#/components/schemas/OnboardingRepresentativeKyc'
          type: array
          title: Representatives
          description: Every representative on the application with their identity verification (KYC) status. The top-level `kyc_status` reflects the primary representative; the application can only be approved once every representative is approved.
        consent_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Consent Url
          description: Link where the primary representative reviews and accepts the required agreements and disclosures in their browser. Populated once the application has been submitted; share it with the primary representative. The link needs no login and anyone holding it can accept on the business's behalf, so treat it as a secret.
      type: object
      required:
      - entity_id
      - status
      - business_name
      - created_at
      - updated_at
      - documents
      - kyc_status
      - onboarding_type
      - next_step
      - representatives
      - consent_url
      title: EntityOnboardingStatusResponse
    EntityDocumentUploadRequest:
      properties:
        proof_type:
          $ref: '#/components/schemas/PublicKybProofType'
          description: Type of KYB document being uploaded. Common values are `incorporation` (certificate of incorporation or formation document), `address` (proof of business address), and `bank_statement`. Non-US businesses also upload `shareholder_registry` (your shareholder registry, also called the register of members) and `officer_registry` (your register of directors and officers). The onboarding status response lists exactly what an entity owes in `next_step.required_proof_types`.
        file_name:
          type: string
          title: File Name
          description: Original file name including extension.
        content_type:
          type: string
          title: Content Type
          description: MIME type of the file (e.g. `application/pdf`, `image/png`).
          default: application/pdf
        representative_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Representative Id
          description: Attach this document to a representative (e.g. their ID or proof of address). Pass the `representative_id` returned when the representative was added or listed; omit for business-level documents. Pass the same value again when confirming the upload — the confirm call is what records the link.
      type: object
      required:
      - proof_type
      - file_name
      title: EntityDocumentUploadRequest
