    EntityRepresentativeKycResponse:
      properties:
        representative_id:
          type: string
          format: uuid
          title: Representative Id
          description: ID of the representative whose KYC was submitted.
        kyc_status:
          $ref: '#/components/schemas/OnboardingKycStatus'
          description: This representative's identity verification status right after submission. It completes asynchronously; track this representative's status in the `representatives` array on `GET /entities/{entity_id}` or via the `identity_verification.*` webhooks. The entity's top-level `kyc_status` reflects only the primary representative, and `next_step` advances once every representative has started verification (not once they pass) — so neither confirms this representative's outcome.
      type: object
      required:
      - representative_id
      - kyc_status
      title: EntityRepresentativeKycResponse
